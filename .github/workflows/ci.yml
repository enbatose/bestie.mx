name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit & API tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install root deps
        run: npm ci --no-audit --no-fund

      - name: Install server deps
        run: npm ci --no-audit --no-fund --prefix server

      - name: Server unit/API tests (gate)
        run: npm test --prefix server
        env:
          NODE_ENV: test
          AUTH_JWT_SECRET: ci-test-auth-jwt-secret-32chars-min

      - name: Frontend unit tests (gate)
        run: npx --yes vitest run --dir src
        env:
          NODE_ENV: test

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: unit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install root deps
        run: npm ci --no-audit --no-fund

      - name: Install server deps
        run: npm ci --no-audit --no-fund --prefix server

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build server + SPA (same-origin API)
        run: npm run build:e2e
        env:
          NODE_ENV: production
          VITE_API_URL: ""

      - name: Run E2E (isolated temp DB)
        run: npm run test:e2e
        env:
          CI: "true"
          AUTH_JWT_SECRET: ci-e2e-auth-jwt-secret-32chars-min

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
